name: Telegram post
on:
  workflow_dispatch:
    inputs:
      photo_path:
        description: "Repo ichidagi rasm yo'li (masalan 2026-11-07/0900/post.png). Bo'sh bo'lsa faqat matn."
        required: false
      caption_path:
        description: "Caption/matn fayli yo'li (HTML)"
        required: true
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send to @vexor_uz
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PHOTO: ${{ inputs.photo_path }}
          CAP: ${{ inputs.caption_path }}
        run: |
          if [ -n "$PHOTO" ]; then
            curl -sS --fail-with-body "https://api.telegram.org/bot$TOKEN/sendPhoto" \
              -F chat_id=@vexor_uz -F parse_mode=HTML -F photo=@"$PHOTO" -F caption="<$CAP"
          else
            curl -sS --fail-with-body "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -F chat_id=@vexor_uz -F parse_mode=HTML -F text="<$CAP"
          fi
